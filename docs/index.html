<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>محاكي تحويل النقاط إلى خريطة ذهنية (C# + GitHub)</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #0f172a; color: #e2e8f0; display: flex; flex-direction: column; min-height: 100vh; }
    header { padding: 14px 20px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
    header h1 { margin: 0; font-size: 1.05rem; color: #38bdf8; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    button, input { background: #0f172a; color: #e2e8f0; border: 1px solid #475569; border-radius: 8px; padding: 7px 12px; font-size: 0.9rem; }
    button { cursor: pointer; background: #0284c7; border-color: #0284c7; font-weight: 600; }
    button.secondary { background: #334155; border-color: #475569; }
    button:hover { opacity: 0.92; }
    .zoom-badge { font-size: 0.85rem; color: #cbd5e1; background: #0f172a; border: 1px solid #475569; border-radius: 8px; padding: 6px 10px; min-width: 62px; text-align: center; }
    main { display: grid; grid-template-columns: 360px 1fr; flex: 1; min-height: 0; }
    @media (max-width: 850px) { main { grid-template-columns: 1fr; } }
    .panel { padding: 14px; background: #1e293b; border-left: 1px solid #334155; display: flex; flex-direction: column; gap: 10px; }
    label { font-size: 0.85rem; color: #94a3b8; }
    textarea { width: 100%; flex: 1; min-height: 240px; background: #0f172a; color: #f8fafc; border: 1px solid #475569; border-radius: 8px; padding: 10px; font-size: 0.95rem; line-height: 1.6; resize: vertical; }
    .canvas-wrap { position: relative; overflow: hidden; min-height: 520px; background: radial-gradient(#1e293b 1px, transparent 1px); background-size: 20px 20px; cursor: grab; touch-action: none; user-select: none; }
    .canvas-wrap.grabbing { cursor: grabbing; }
    svg { display: block; width: 100%; height: 100%; min-height: 520px; }
    .node-group { cursor: pointer; }
    .hint { font-size: 0.8rem; color: #94a3b8; line-height: 1.5; }
  </style>
</head>
<body>
  <header>
    <h1>محاكي النقاط إلى خريطة ذهنية</h1>
    <div class="controls">
      <input id="rootTitle" type="text" value="خريطة ذهنية" placeholder="عنوان الجذر" />
      <button id="renderBtn">تحديث الخريطة</button>
      <button id="expandAllBtn" class="secondary">فتح الكل</button>
      <button id="zoomInBtn" class="secondary">+</button>
      <span id="zoomBadge" class="zoom-badge">100%</span>
      <button id="zoomOutBtn" class="secondary">-</button>
      <button id="resetViewBtn" class="secondary">إعادة ضبط العرض</button>
      <button id="loadJsonBtn" class="secondary">تحميل mindmap.json</button>
      <button id="exportJsonBtn" class="secondary">تصدير JSON</button>
      <button id="importJsonBtn" class="secondary">استيراد JSON</button>
      <button id="downloadSvgBtn" class="secondary">حفظ SVG</button>
      <input id="jsonFileInput" type="file" accept=".json,application/json" style="display:none" />
    </div>
  </header>

  <main>
    <section class="panel">
      <label for="bulletsInput">اكتب النقاط (استخدم مسافتين لكل مستوى فرعي):</label>
      <textarea id="bulletsInput">- الروبوتات
  - الحساسات
    - حساس المسافة
    - حساس تتبع الخط
  - التحكم
    - أردوينو
    - راسبيري باي</textarea>
      <div class="hint">
        • اسحب الخلفية لتحريك العرض، واستخدم (+) و (-) أو عجلة الماوس للتكبير والتصغير.<br />
        • اضغط على أي فرع له أبناء لطيّه أو فتحه.
      </div>
    </section>

    <section id="canvasWrap" class="canvas-wrap">
      <svg id="mapSvg" viewBox="0 0 1000 600">
        <g id="viewportGroup"></g>
      </svg>
    </section>
  </main>

  <script>
    let currentTree = null;
    let panX = 20;
    let panY = 20;
    let scale = 1;
    let isPanning = false;
    let startX = 0;
    let startY = 0;
    let movedDuringDrag = false;

    const canvasWrap = document.getElementById("canvasWrap");
    const svg = document.getElementById("mapSvg");
    const viewportGroup = document.getElementById("viewportGroup");
    const zoomBadge = document.getElementById("zoomBadge");

    function applyTransform() {
      viewportGroup.setAttribute("transform", `translate(${panX}, ${panY}) scale(${scale})`);
      zoomBadge.textContent = `${Math.round(scale * 100)}%`;
    }

    function setZoom(newScale, anchorX = 120, anchorY = 120) {
      const clamped = Math.max(0.35, Math.min(2.5, newScale));
      const ratio = clamped / scale;
      panX = anchorX - (anchorX - panX) * ratio;
      panY = anchorY - (anchorY - panY) * ratio;
      scale = clamped;
      applyTransform();
    }

    function resetView() {
      panX = 20;
      panY = 20;
      scale = 1;
      applyTransform();
    }

    canvasWrap.addEventListener("pointerdown", (e) => {
      if (e.button !== undefined && e.button !== 0 && e.pointerType === "mouse") return;
      isPanning = true;
      movedDuringDrag = false;
      startX = e.clientX - panX;
      startY = e.clientY - panY;
      canvasWrap.classList.add("grabbing");
    });

    window.addEventListener("pointermove", (e) => {
      if (!isPanning) return;
      const nextX = e.clientX - startX;
      const nextY = e.clientY - startY;
      if (Math.abs(nextX - panX) > 3 || Math.abs(nextY - panY) > 3) {
        movedDuringDrag = true;
      }
      panX = nextX;
      panY = nextY;
      applyTransform();
    });

    window.addEventListener("pointerup", () => {
      if (!isPanning) return;
      isPanning = false;
      canvasWrap.classList.remove("grabbing");
      setTimeout(() => { movedDuringDrag = false; }, 0);
    });

    canvasWrap.addEventListener("wheel", (e) => {
      e.preventDefault();
      const rect = canvasWrap.getBoundingClientRect();
      const cx = e.clientX - rect.left;
      const cy = e.clientY - rect.top;
      const factor = e.deltaY < 0 ? 1.12 : 0.89;
      setZoom(scale * factor, cx, cy);
    }, { passive: false });

    document.getElementById("zoomInBtn").addEventListener("click", () => setZoom(scale * 1.15));
    document.getElementById("zoomOutBtn").addEventListener("click", () => setZoom(scale * 0.85));
    document.getElementById("resetViewBtn").addEventListener("click", resetView);

    function parseBullets(rawText, rootTitle) {
      const root = { title: rootTitle || "الخريطة الذهنية", children: [], collapsed: false };
      const stack = [{ indent: -1, node: root }];
      const lines = rawText.split(/\r?\n/);

      for (const rawLine of lines) {
        if (!rawLine.trim()) continue;
        const normalized = rawLine.replace(/\t/g, "  ");
        const indent = (normalized.match(/^ */) || [""])[0].length;
        const cleaned = normalized.trim().replace(/^[-*•]\s*/, "").trim();
        if (!cleaned) continue;

        while (stack.length > 1 && stack[stack.length - 1].indent >= indent) {
          stack.pop();
        }
        const child = { title: cleaned, children: [], collapsed: false };
        stack[stack.length - 1].node.children.push(child);
        stack.push({ indent, node: child });
      }
      return root;
    }

    function setAllCollapsed(node, collapsed) {
      if (!node) return;
      if (node.children && node.children.length > 0) {
        node.collapsed = collapsed;
        node.children.forEach(c => setAllCollapsed(c, collapsed));
      }
    }

    function layoutTree(root) {
      let leafIndex = 0;
      const levelGap = 220;
      const rowGap = 74;

      function assignCoords(node, depth) {
        const visibleChildren = node.collapsed ? [] : (node.children || []);
        if (visibleChildren.length === 0) {
          node.x = 130 + depth * levelGap;
          node.y = 70 + leafIndex * rowGap;
          leafIndex++;
          return node.y;
        }
        const childYs = visibleChildren.map(c => assignCoords(c, depth + 1));
        node.x = 130 + depth * levelGap;
        node.y = (Math.min(...childYs) + Math.max(...childYs)) / 2;
        return node.y;
      }

      assignCoords(root, 0);
      const maxX = Math.max(1000, root.x + 420);
      const maxY = Math.max(600, leafIndex * rowGap + 120);
      return { maxX, maxY };
    }

    function renderMindMap(root) {
      currentTree = root;
      const { maxX, maxY } = layoutTree(root);
      svg.setAttribute("viewBox", `0 0 ${maxX} ${maxY}`);
      viewportGroup.innerHTML = "";

      const ns = "http://www.w3.org/2000/svg";
      const colors = ["#0284c7", "#0d9488", "#7c3aed", "#d97706"];

      function drawEdges(node, depth) {
        if (node.collapsed) return;
        for (const child of node.children || []) {
          const path = document.createElementNS(ns, "path");
          const midX = (node.x + child.x) / 2;
          const d = `M ${node.x + 70} ${node.y} C ${midX} ${node.y}, ${midX} ${child.y}, ${child.x - 70} ${child.y}`;
          path.setAttribute("d", d);
          path.setAttribute("fill", "none");
          path.setAttribute("stroke", colors[depth % colors.length]);
          path.setAttribute("stroke-width", "2.5");
          viewportGroup.appendChild(path);
          drawEdges(child, depth + 1);
        }
      }

      function drawNodes(node, depth) {
        const hasChildren = Array.isArray(node.children) && node.children.length > 0;
        const g = document.createElementNS(ns, "g");
        g.setAttribute("class", "node-group");

        const labelText = hasChildren && node.collapsed
          ? `${node.title} (+${node.children.length})`
          : node.title;

        const rect = document.createElementNS(ns, "rect");
        const w = Math.max(135, Math.min(240, labelText.length * 10 + 38));
        const h = 40;
        rect.setAttribute("x", node.x - w / 2);
        rect.setAttribute("y", node.y - h / 2);
        rect.setAttribute("width", w);
        rect.setAttribute("height", h);
        rect.setAttribute("rx", "10");
        rect.setAttribute("fill", depth === 0 ? "#0369a1" : "#1e293b");
        rect.setAttribute("stroke", colors[depth % colors.length]);
        rect.setAttribute("stroke-width", hasChildren ? "2.5" : "1.8");

        const text = document.createElementNS(ns, "text");
        text.setAttribute("x", node.x);
        text.setAttribute("y", node.y + 5);
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("fill", "#f8fafc");
        text.setAttribute("font-size", "13.5");
        text.textContent = labelText;

        g.appendChild(rect);
        g.appendChild(text);

        if (hasChildren) {
          g.addEventListener("click", (e) => {
            e.stopPropagation();
            if (movedDuringDrag) return;
            node.collapsed = !node.collapsed;
            renderMindMap(currentTree);
          });
        }

        viewportGroup.appendChild(g);

        if (!node.collapsed) {
          for (const child of node.children || []) {
            drawNodes(child, depth + 1);
          }
        }
      }

      drawEdges(root, 0);
      drawNodes(root, 0);
      applyTransform();
    }

    function updateFromTextarea() {
      const text = document.getElementById("bulletsInput").value;
      const title = document.getElementById("rootTitle").value;
      renderMindMap(parseBullets(text, title));
    }

    document.getElementById("renderBtn").addEventListener("click", updateFromTextarea);
    document.getElementById("bulletsInput").addEventListener("input", updateFromTextarea);
    document.getElementById("rootTitle").addEventListener("input", updateFromTextarea);

    document.getElementById("expandAllBtn").addEventListener("click", () => {
      if (!currentTree) return;
      setAllCollapsed(currentTree, false);
      renderMindMap(currentTree);
    });

    document.getElementById("exportJsonBtn").addEventListener("click", () => {
      if (!currentTree) return;
      const blob = new Blob([JSON.stringify(currentTree, null, 2)], { type: "application/json;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "mindmap.json";
      a.click();
      URL.revokeObjectURL(url);
    });

    const jsonFileInput = document.getElementById("jsonFileInput");
    document.getElementById("importJsonBtn").addEventListener("click", () => jsonFileInput.click());
    jsonFileInput.addEventListener("change", async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      try {
        const text = await file.text();
        const data = JSON.parse(text);
        const mapped = mapImportedNode(data);
        document.getElementById("rootTitle").value = mapped.title || "خريطة ذهنية";
        renderMindMap(mapped);
      } catch {
        alert("تعذر قراءة ملف JSON، تأكد من صحة تنسيقه.");
      }
      jsonFileInput.value = "";
    });

    document.getElementById("loadJsonBtn").addEventListener("click", async () => {
      try {
        const res = await fetch("./mindmap.json?t=" + Date.now());
        if (!res.ok) throw new Error("ملف mindmap.json غير موجود بعد");
        const data = await res.json();
        const mapped = mapImportedNode(data);
        document.getElementById("rootTitle").value = mapped.title || "خريطة ذهنية";
        renderMindMap(mapped);
      } catch (err) {
        alert(err.message);
      }
    });

    function mapImportedNode(n) {
      return {
        title: n.Title ?? n.title ?? "فرع",
        collapsed: Boolean(n.collapsed),
        children: (n.Children ?? n.children ?? []).map(mapImportedNode)
      };
    }

    document.getElementById("downloadSvgBtn").addEventListener("click", () => {
      const svgData = new XMLSerializer().serializeToString(svg);
      const blob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "mindmap.svg";
      a.click();
      URL.revokeObjectURL(url);
    });

    updateFromTextarea();
  </script>
</body>
</html>
